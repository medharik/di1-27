<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>les tableaux en html</title>
</head>
<body>
    <h1>les tableaux en html</h1>
    <h2>les bases </h2>

    <table width="400" border="1"  align="center" > 
        <tr>
            <th>Produits :</th>
            <th>Prix</th>
        </tr>
        <tr>
            <td>hp </td>
            <td>4000</td>
        </tr>
        <tr>
            <td>dell</td>
            <td>7000</td>
        </tr>
        <tr>
            <td>sony</td>
            <td>8000</td>
        </tr>




    </table>
    <h2>fusion des cellules</h2>


    <table border="1" align="center" width="300" >
        <tr>
            <td>A</td>
            <td colspan="2">B</td>
          
        </tr>
        <tr>
            <td align="center" colspan="3">D</td>
          
        </tr>
        <tr>
            <td>G</td>
            <td>H</td>
            <td rowspan="2">I</td>
        </tr>
        <tr>
            <td colspan="2">J</td>
          
          
        </tr>
    </table>

</body>
</html>
